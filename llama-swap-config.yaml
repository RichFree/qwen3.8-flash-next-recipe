# llama-swap config for bfg — deployed to ~/Projects/03_experiments/qwen3.8_hosting/
# (see deploy/bfg_llama_swap/README.md for the why and the cutover checklist).
#
# bfg serves two models, each a plain vLLM deployment (see ../../README.md's
# "Remote and LAN backends"): qwen3.8-27b and qwen3.8-flash-next (the latter
# added 2026-09-26 after validating it manually — see models/
# qwen3.8-flash-next/README.md's "2026-09-26: validated working config" for
# the full investigation behind its flags). Neither is pinned to a specific
# GPU — see ${gpu_check} below. Unlike spark1's llama-server instances, vLLM
# has no in-place unload/reload — the process either holds the weights or it
# doesn't. So "dynamic" here means llama-swap starts the whole vLLM process
# on first request and kills it after an idle ttl, same mechanism spark1
# already uses, just wrapping `vllm serve` instead of `llama-server`.
#
# No groups/exclusivity needed between the two — neither is pinned to a
# specific GPU (see ${gpu_check} below), so there's no shared-resource
# contention forcing one to unload the other. bfg is deliberately
# concurrency-focused (each model sized to hold many in-flight KV caches)
# rather than a multi-model swap host like spark1.
#
# Both GPUs are otherwise shared (GPU1: other people's transient jobs; GPU0:
# bimo's own resident deployment sometimes lives there). Since spinning down
# is the whole point of this change, there's a real window where someone
# else's job claims a GPU's now-free memory before the next request tries to
# reload us. cmd: below points at pick_gpu_and_launch.sh, not vllm directly —
# it picks whichever candidate GPU actually has room (see that script; it
# replaced a per-model fixed CUDA_VISIBLE_DEVICES on 2026-09-26, after that
# fixed-assignment approach caused a real collision risk — see its own
# comment for the history) and refuses to start at all if neither does,
# instead of loading anyway and crashing into whatever's running there.

# NOT 12001 — that's bfg-probe.service's port (deploy/bfg_probe/), a fixed
# assignment unrelated to this config. Learned the hard way: llama-swap
# assigns ${PORT} starting here, vLLM tried to bind 12001, and hit
# "Address already in use" against the probe every time (see git history).
startPort: 13001
logToStdout: "both"

# Applies to both models below (global, not per-model). Measured 2026-09-23
# for qwen3.8-27b (first real cutover, before the --kv-cache-memory change
# below): cold start took ~5 minutes — weights + dflash draft model + ~50s
# GPU-memory profiling pass + two rounds of CUDA graph capture + extra warmup
# on the first real request. No fast path here, unlike llama-server's
# --cache-ram resume. 300s was the original placeholder and would have been
# cutting it uncomfortably close (that run took ~297-302s of wall-clock);
# 600s gives headroom even before the profiling-pass elimination below.
# qwen3.8-flash-next measured faster cold starts (~3-4 minutes, including its
# own CUDA graph capture and n-gram/KV-cache CPU offload setup) — same 600s
# comfortably covers it too.
healthCheckTimeout: 600

macros:
  # pick_gpu_and_launch.sh (2026-09-26+) picks whichever candidate GPU (0 or
  # 1, both RTX PRO 6000 Blackwell) actually has enough free memory at launch
  # time — see that script for the full why (it replaced a fixed
  # CUDA_VISIBLE_DEVICES per model, which had a real collision risk once more
  # than one model could land on the same GPU) — then delegates to
  # check_gpu_and_launch.sh for a final fit-recheck + the actual exec into
  # vllm. Both models below route through this same macro; neither is pinned
  # to a specific GPU anymore, so there's nothing to edit here to "switch"
  # one — it's automatic every time a model cold-starts.
  gpu_check: /home/richard/Projects/03_experiments/qwen3.8_hosting/pick_gpu_and_launch.sh

models:
  qwen3.8-27b:
    # Called directly (not via serve.sh) so llama-swap's SIGTERM lands on the
    # vllm process itself rather than a wrapping shell — llama-swap signals
    # only the one PID it launched (proxy/process.go: no process-group kill),
    # so vLLM's own signal handling has to be what tears down its EngineCore
    # subprocess. Confirmed EngineCore is a real child of this PID on bfg
    # today (ps: EngineCore's PPID == the vllm serve PID), which is the
    # precondition for that to work — but "should cascade" is not "verified
    # cascades cleanly under llama-swap specifically". Check for orphaned
    # EngineCore processes / held VRAM after the first ttl-triggered stop,
    # before trusting this unattended. See README checklist.
    #
    # ${gpu_check} stands in for the vllm binary itself (see macro above) —
    # it picks a GPU with room and exec's into vllm once confirmed, so the
    # args below are identical to calling vllm directly.
    #
    # Switched 2026-09-23 from the unsloth NVFP4 checkpoint to this FP8 one,
    # with --kv-cache-dtype fp8 explicit below. The NVFP4 checkpoint (no
    # explicit --kv-cache-dtype, so it defaulted to NVFP4 KV to match) hit
    # https://github.com/flashinfer-ai/flashinfer/issues/4731 — an upstream,
    # hardware-specific bug: SM120 (this GPU) + NVFP4 KV + masked multi-token
    # XQA verify (exactly what dflash speculative decoding does) is flaky.
    # Not a config mistake on our end — it only ever surfaced here *because*
    # dynamic loading repeats the cold-start path far more often than the old
    # always-resident process did (see docs/gateway/guides/
    # bfg-dynamic-cutover.md for the failure investigation). bimo's own
    # separate deployment on this same box (GPU0, port 9132) has run this
    # exact model + --kv-cache-dtype fp8 + the same dflash speculative-config
    # stably the whole time we were debugging the NVFP4 path — good live
    # evidence this combination avoids the bug. Dropped --mm-encoder-tp-mode
    # (this checkpoint has no mmproj/vision component, unlike the NVFP4 one).
    # Tried --max-num-seqs 8 (matching bimo's invocation) as a diagnostic —
    # ruled out: identical failure with or without it, so batch-size/
    # CUDA-graph-shape selection was never the actual trigger. The real fix
    # is the CUDA_HOME/PATH/LD_LIBRARY_PATH env in check_gpu_and_launch.sh —
    # see that script's comment and docs/gateway/guides/
    # bfg-dynamic-cutover.md.
    #
    # Switched 2026-10-07 from dflash (external Qwen3.8-27B-DFlash2 draft
    # model) to this checkpoint's own built-in MTP head (method: "mtp",
    # 1 native mtp.* layer per model.safetensors.index.json — see
    # docs/TODO.md's dflash entry for the full incident). Prompted by a
    # draft-acceptance-rate collapse to 0.0% that coincided with garbled
    # ("weird symbols") output, matching the known SM120 + fp8 KV + masked
    # multi-token verify flakiness (flashinfer #4731) that's also why we're
    # off the NVFP4 checkpoint above — that bug is in the verify mechanism
    # itself, which MTP still exercises too (just a 3-token window instead
    # of dflash's 7), so this is a mitigation attempt, not a confirmed fix.
    # Manually validated on GPU1 beforehand: starts clean, 41-55% acceptance
    # rate (vs. dflash's prior ~25-50%), coherent output over a handful of
    # requests — not yet exercised under the sustained/concurrent load that
    # triggered the original collapse; validating that live is the next
    # step. --max-num-seqs 512 is required here (not needed for dflash):
    # the MTP head's extra layer narrows the Mamba-cache-block budget enough
    # that the default 1024 overflows it (vLLM: "max_num_seqs (1024) exceeds
    # available Mamba cache blocks (899)").
    cmd: "${gpu_check} serve /data/huggingface/hub/models--Qwen--Qwen3.8-27B-FP8/snapshots/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
      --served-model-name qwen3.8-27b
      --port ${PORT}
      --trust-remote-code
      --kv-cache-dtype fp8
      --max-model-len 262144
      --max-num-seqs 512
      --gpu-memory-utilization 0.85
      --tensor-parallel-size 1
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --speculative-config '{\"method\": \"mtp\", \"num_speculative_tokens\": 3}'"
    env:
      # No CUDA_VISIBLE_DEVICES/GPU_INDEX here anymore — pick_gpu_and_launch.sh
      # sets both dynamically before delegating to check_gpu_and_launch.sh.
      # UTILIZATION_PCT is the one thing that must still be declared per
      # model (matches --gpu-memory-utilization above; both scripts read it).
      - "UTILIZATION_PCT=85"
      - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
    checkEndpoint: /health
    # Idle time before llama-swap kills the process and frees the target GPU's ~85GB.
    # Placeholder — trades off against the cold-start cost above; tune once
    # that's measured and usage patterns are known. Shared GPU box (bimo and
    # others also run jobs on it), so freeing VRAM when idle is the whole
    # point — but not so aggressively that normal usage gaps cause thrashing.
    ttl: 1200

  # Validated 2026-09-26 — see models/qwen3.8-flash-next/README.md's
  # "2026-09-26: validated working config" section for the full investigation
  # behind every flag below (why nightly vLLM, why the two separate CPU
  # offloads, why --max-num-seqs is set instead of --max-model-len, why MTP
  # speculative decoding is deliberately NOT enabled). Mirrors
  # models/qwen3.8-flash-next/serve.sh — keep the two in sync.
  #
  # Not pinned to a GPU — ${gpu_check} (pick_gpu_and_launch.sh) picks
  # whichever of GPU0/GPU1 has room at launch time, same as qwen3.8-27b.
  qwen3.8-flash-next:
    cmd: "${gpu_check} serve /data/huggingface/hub/models--Inferact--Qwen3.8-Flash-Next-NVFP4/snapshots/103a7608316173ca6edd49929544244de7ffda70
      --served-model-name qwen3.8-flash-next
      --port ${PORT}
      --trust-remote-code
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.95
      --max-model-len 262144
      --max-num-seqs 8
      --cpu-offload-gb 100
      --cpu-offload-params ngram_embedding
      --offload-backend uva
      --kv-transfer-config '{\"kv_connector\":\"OffloadingConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"cpu_bytes_to_use\":34359738368,\"blocks_per_chunk\":4}}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3"
    env:
      # No CUDA_VISIBLE_DEVICES/GPU_INDEX here — pick_gpu_and_launch.sh sets
      # both dynamically. NOT expandable_segments:True — incompatible with
      # the OffloadingConnector above (vLLM rejects the combination outright
      # at config-validation time). See the README section this points to.
      - "UTILIZATION_PCT=95"
    checkEndpoint: /health
    ttl: 1200
